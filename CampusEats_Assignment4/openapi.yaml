openapi: 3.0.3

info:
  title: CampusEats Order Service
  version: 1.0.0
  description: REST API for managing CampusEats orders

servers:
  - url: http://localhost:5000

paths:
  /orders:
    post:
      summary: Create a new order
      responses:
        '201':
          description: Order created
        '400':
          description: Bad request

    get:
      summary: List orders
      responses:
        '200':
          description: List of orders

  /orders/{orderId}:
    get:
      summary: Get order by ID
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Order found
        '404':
          description: Order not found

  /orders/{orderId}/cancellation:
    post:
      summary: Cancel an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '202':
          description: Cancellation accepted
        '404':
          description: Order not found

components:
  schemas:
    Order:
      type: object
      properties:
        id:
          type: integer
        item:
          type: string
        quantity:
          type: integer

    Error:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
